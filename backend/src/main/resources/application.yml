spring:
  application:
    name: askar-talimi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/askar_talimi1}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lazy bog'liqliklarni bittalab emas, 50 tadan guruhlab yuklaydi (N+1 so'rovlarni kamaytiradi).
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}
  # Nginx (ichki tarmoq) yuborgan X-Forwarded-For faqat ishonchli proksidan qabul qilinadi.
  forward-headers-strategy: native

app:
  jwt:
    # Kamida 32 belgi. Productionda JWT_SECRET muhit o'zgaruvchisi orqali beriladi.
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123}
    ttl-minutes: 480
  security:
    max-failed-logins: 5
    lock-minutes: 15
  cors:
    allowed-origins: ${CORS_ORIGINS:http://172.16.140.17:5173}
  storage:
    dir: ${STORAGE_DIR:./data/files}
    secret: ${STORAGE_SECRET:change-me-storage-secret}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # Bo'sh bazaga yaratiladigan boshlang'ich hisoblar paroli; bo'sh bo'lsa, har bir hisobga tasodifiy parol yaratilib logga yoziladi.
  initial-password: ${INITIAL_PASSWORD:}
  login:
    max-attempts-per-ip: 20
    window-minutes: 10

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${DOCS_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
