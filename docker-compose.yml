# Lokal ishga tushirish: docker compose up --build
# Faqat baza kerak bo'lsa: docker compose up db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: askar_talimi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ni .env faylida belgilang}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askar_talimi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/askar_talimi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ni .env faylida belgilang}
      # prod profili standart maxfiy qiymatlar bilan ishga tushishni rad etadi.
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ni .env faylida belgilang (kamida 32 belgi)}
      STORAGE_SECRET: ${STORAGE_SECRET:?STORAGE_SECRET ni .env faylida belgilang}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-}
      CORS_ORIGINS: http://localhost:8088
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SERVER_PORT: "8081"
    volumes:
      - file-data:/app/data/files
    # Backend faqat frontend (nginx) orqali ochiladi: 8081 portini tashqariga chiqarmang.
    expose:
      - "8081"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  db-data:
  file-data:
